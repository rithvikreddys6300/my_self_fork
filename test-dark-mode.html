<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Mode Toggle Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        /* Custom CSS variables for light and dark modes */
        :root {
            --background: 255 255 255;
            --foreground: 0 0 0;
            --border: 229 231 235;
        }

        .dark {
            --background: 31 31 31;
            --foreground: 255 255 255;
            --border: 75 85 99;
        }

        body {
            background-color: rgb(var(--background));
            color: rgb(var(--foreground));
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .theme-toggle {
            border: 1px solid rgb(var(--border));
            background-color: transparent;
            color: rgb(var(--foreground));
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            background-color: rgba(var(--foreground), 0.1);
        }
    </style>
</head>
<body class="min-h-screen">
    <!-- Navigation bar similar to the app -->
    <header class="w-full py-4 px-6 flex justify-between items-center max-w-4xl mx-auto h-[67px]">
        <div class="flex items-center gap-2">
            <div class="h-[30px] w-[30px] bg-gray-300 dark:bg-gray-600 rounded"></div>
            <span class="font-bold">Self.so</span>
        </div>

        <div class="flex items-center gap-3">
            <!-- Theme Toggle Button -->
            <button 
                id="themeToggle" 
                class="theme-toggle w-9 h-9 p-0 rounded-md flex items-center justify-center"
                aria-label="Toggle theme"
            >
                <svg id="moonIcon" class="h-5 w-5 text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
                <svg id="sunIcon" class="h-5 w-5 text-orange-500 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg>
            </button>

            <!-- Mock buttons -->
            <button class="flex items-center gap-1.5 py-2 px-4 border border-gray-300 dark:border-gray-600 text-gray-600 dark:text-gray-300 text-sm rounded-md">
                <span>GitHub</span>
            </button>
            <button class="text-sm py-2 px-4 bg-gray-900 dark:bg-gray-100 text-white dark:text-gray-900 rounded-md">
                Sign up
            </button>
        </div>
    </header>

    <!-- Main content -->
    <main class="flex-1 flex flex-col items-center justify-center p-8">
        <div class="max-w-2xl mx-auto text-center space-y-6">
            <h1 class="text-4xl font-bold">Dark Mode Toggle Test</h1>
            <p class="text-lg text-gray-600 dark:text-gray-300">
                Click the moon/sun icon in the navigation bar to toggle between light and dark modes.
            </p>
            <div class="p-6 border border-gray-200 dark:border-gray-700 rounded-lg bg-gray-50 dark:bg-gray-800">
                <h2 class="text-xl font-semibold mb-3">Test Card</h2>
                <p class="text-gray-600 dark:text-gray-300">
                    This card demonstrates how the dark mode affects different elements on the page.
                    The theme should persist across page refreshes.
                </p>
            </div>
        </div>
    </main>

    <script>
        // Theme toggle functionality
        const themeToggle = document.getElementById('themeToggle');
        const moonIcon = document.getElementById('moonIcon');
        const sunIcon = document.getElementById('sunIcon');
        const html = document.documentElement;

        // Check for saved theme preference or default to 'light'
        const currentTheme = localStorage.getItem('theme') || 'light';
        
        // Set initial theme
        if (currentTheme === 'dark') {
            html.classList.add('dark');
            moonIcon.classList.add('hidden');
            sunIcon.classList.remove('hidden');
        } else {
            html.classList.remove('dark');
            moonIcon.classList.remove('hidden');
            sunIcon.classList.add('hidden');
        }

        // Theme toggle event listener
        themeToggle.addEventListener('click', () => {
            const isDark = html.classList.contains('dark');
            
            if (isDark) {
                html.classList.remove('dark');
                moonIcon.classList.remove('hidden');
                sunIcon.classList.add('hidden');
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                moonIcon.classList.add('hidden');
                sunIcon.classList.remove('hidden');
                localStorage.setItem('theme', 'dark');
            }
        });

        // Listen for system theme changes
        const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
        mediaQuery.addListener(() => {
            if (!localStorage.getItem('theme')) {
                const isDark = mediaQuery.matches;
                html.classList.toggle('dark', isDark);
                moonIcon.classList.toggle('hidden', isDark);
                sunIcon.classList.toggle('hidden', !isDark);
            }
        });
    </script>
</body>
</html>
